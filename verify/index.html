<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verifying | Mets Media House</title>
    <meta name="description" content="Verifying your Mets Media House application.">
    <link rel="stylesheet" href="/assets/styles.css?v=offer-dark-1">
  </head>
  <body>
    <script>
      // Only people who finished /apply get through. ?skip=1 is the manual
      // bypass for links we hand out directly, e.g. a referral.
      (function () {
        var bypass = new URLSearchParams(window.location.search).has("skip");
        if (bypass) sessionStorage.setItem("metsApplyComplete", "1");
        if (sessionStorage.getItem("metsApplyComplete") !== "1") {
          window.location.replace("/apply/");
        }
      })();
    </script>
    <main class="shell">
      <section class="card loading-card" aria-live="polite">
        <p class="eyebrow">Application review</p>
        <h1>Checking your answers.</h1>
        <div class="loading-wrap" aria-hidden="true">
          <div class="loading-bar"></div>
        </div>
        <p class="warning">Sending your answers through to the team...</p>
      </section>
    </main>
    <script>
      window.setTimeout(() => {
        window.location.href = "/book/";
      }, 4000);
    </script>
  </body>
</html>
